---
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: dev
    # Only security
    open-pull-requests-limit: 0

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "monthly"
    target-branch: dev
    open-pull-requests-limit: 1
